name: verify

on:
  push:
  pull_request:

jobs:
  vhdl-and-generated-verilog:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install simulators
        run: sudo apt-get update && sudo apt-get install -y ghdl iverilog
      # cocotb 2.0.1 requires Verilator 5.036 or newer; Ubuntu 24.04 ships 5.006.
      - uses: veryl-lang/setup-verilator@b155747595eb4b817473a83045ba1da581c4084b
        with:
          version: 5.036
      - name: Check Verilator version
        run: verilator --version
      - name: Install Python verification tools
        run: python -m pip install -r verification/requirements.txt
      - name: Fetch pinned official vectors
        run: make vectors
      - name: Check Python source syntax
        run: python -m compileall -q verification paper
      - name: Run direct VHDL tests
        run: make model-test permutation-test ghdl-test vhdl-textio-test weight-file-test
      - name: Translate and lint with Icarus and Verilator
        run: make iverilog-lint verilator-lint
      - name: Run generated Verilog smoke tests
        env:
          KAT_LIMIT: "8"
        run: make iverilog-test verilator-test

      - name: Check grouped rounds and concurrent buffered traffic
        run: |
          python verification/run_permutation.py --rounds-per-cycle 3
          FULL_KAT=1 python verification/run.py --rounds-per-cycle 3 --module test_stream
          FULL_KAT=1 python verification/run.py --rounds-per-cycle 3 --buffering --module test_stream
          FULL_KAT=0 python verification/run.py --rounds-per-cycle 3 --buffering --input-depth 1 --output-depth 1 --module test_stream
      - name: Check hardware self-test in simulation
        run: make board-selftest board-demo-test

      - name: Check synthesized buffered candidate
        run: |
          ghdl synth --std=08 --out=verilog -gG_ROUNDS_PER_CYCLE=3 -gG_BUFFERING_ENABLE=true rtl/ascon_pkg.vhd rtl/ascon_permutation.vhd rtl/ascon_aead128_core.vhd -e ascon_aead128_core > build/generated/buffered.v
          FULL_KAT=0 python verification/run.py --sim icarus --netlist build/generated/buffered.v --rounds-per-cycle 3 --buffering --module test_stream
          FULL_KAT=0 python verification/run.py --sim verilator --netlist build/generated/buffered.v --rounds-per-cycle 3 --buffering --module test_stream
